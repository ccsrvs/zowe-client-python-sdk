[project]
name = "zowe-client-python-sdk"
version = "0.0.0"
description = "MF Rest Client"
requires-python = ">= 3.12"
dependencies = [
    "commentjson ==0.9.0",
    "deepmerge ==1.1.0",
    "jsonschema ==4.20.0",
    "PyYAML ==6.0.1",
    "requests ==2.32.4"
]


[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 120

[tool.isort]
profile = "black"

[tool.pydoclint]
style = "numpy"
check-arg-order = false
require-return-section-when-returning-nothing = false
quiet = true
